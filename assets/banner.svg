<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0f2e3d" />
      <stop offset="100%" stop-color="#05131e" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.12)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.05)" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatPulse {
        0% { transform: translateY(0px) scale(1); opacity: 0.7; }
        50% { transform: translateY(-8px) scale(1.03); opacity: 0.95; }
        100% { transform: translateY(0px) scale(1); opacity: 0.7; }
      }
      @keyframes scanLine {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(1300px); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { r: 6px; opacity: 0.6; }
        50% { r: 10px; opacity: 1; }
      }

      .bg-grid {
        stroke: rgba(255, 255, 255, 0.04);
        stroke-width: 1;
      }
      .anim-card-1 { animation: floatPulse 6s ease-in-out infinite; }
      .anim-card-2 { animation: floatPulse 7s ease-in-out 1s infinite; }
      .anim-card-3 { animation: floatPulse 8s ease-in-out 2s infinite; }

      .flow-line {
        stroke: url(#greenGrad);
        stroke-width: 2;
        stroke-dasharray: 8 6;
        animation: dashFlow 20s linear infinite;
      }
      .scan-beam {
        animation: scanLine 8s linear infinite;
      }
      .node-dot {
        fill: #10b981;
        animation: pulseNode 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)" />

  <!-- Background Technical Grid Lines -->
  <g class="bg-grid">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- DYNAMIC / ANIMATED BACKGROUND DECORATIONS (BEHIND FOREGROUND TEXT) -->
  <g opacity="0.65">
    <!-- Connected Data Flow Lines -->
    <path d="M 150,320 Q 300,280 450,330 T 750,290 T 1050,340" fill="none" class="flow-line" />
    <path d="M 100,70 Q 350,110 600,60 T 1100,80" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- Dynamic Scanning Laser Beam -->
    <polygon points="0,0 60,0 20,400 -20,400" fill="rgba(16, 185, 129, 0.08)" class="scan-beam" />

    <!-- Dynamic Animated Pill Badges (Background layer) -->
    <g class="anim-card-1" transform="translate(80, 270)">
      <rect width="160" height="42" rx="21" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="25" cy="21" r="5" class="node-dot" />
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">ISO 14001 EHS</text>
    </g>

    <g class="anim-card-2" transform="translate(940, 260)">
      <rect width="170" height="42" rx="21" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="25" cy="21" r="5" fill="#06b6d4" />
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Permits &amp; Audits</text>
    </g>

    <g class="anim-card-3" transform="translate(980, 70)">
      <rect width="160" height="38" rx="19" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="25" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">🌿 ESG &amp; Emissions</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER (GUARANTEED HIGHEST Z-INDEX & HIGH CONTRAST) -->
  <g id="ForegroundContent">
    <!-- Top Decorative Badge -->
    <rect x="50" y="45" width="280" height="32" rx="16" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5" />
    <text x="65" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399" letter-spacing="1">
      🌱 AWESOME ECOSYSTEM DIRECTORY
    </text>

    <!-- Main Title (Bold, Gradient Glow, Solid Contrast) -->
    <text x="50" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="#ffffff" filter="url(#glowGreen)" letter-spacing="-0.5">
      Environmental Compliance
    </text>
    <text x="50" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="40" font-weight="800" fill="#34d399" letter-spacing="-0.5">
      &amp; Management Systems
    </text>

    <!-- Subtitle (Clear Foreground Text) -->
    <text x="50" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Curated SaaS Platforms &amp; Open-Source Tools for Permits, Emissions, Waste, Audits &amp; EHS
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(50, 315)">
      <!-- Pillar 1 -->
      <rect x="0" y="0" width="220" height="46" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🏢 Enterprise SaaS</text>

      <!-- Pillar 2 -->
      <rect x="235" y="0" width="220" height="46" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
      <text x="251" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">💻 Open-Source Repos</text>

      <!-- Pillar 3 -->
      <rect x="470" y="0" width="220" height="46" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <text x="486" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">📋 ISO 14001 / GRC</text>
    </g>
  </g>
</svg>
